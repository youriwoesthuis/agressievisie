<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Artikel gevonden? | AgressieVisie</title>
<meta name="description" content="Artikelen op AgressieVisie hebben nu een eigen adres. Deze pagina stuurt je automatisch door naar het juiste artikel." />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<!-- Deze pagina was ooit het sjabloon dat elk artikel via ?slug= inlaadde met
     JavaScript. Sinds build/build-articles.pl heeft elk artikel een eigen
     statische pagina (artikel-<slug>.html), zodat crawlers zonder JavaScript
     de echte tekst zien in plaats van 18 keer dit lege sjabloon.
     Deze pagina blijft bestaan als doorverwijzing voor oude bladwijzers en
     externe links naar artikel.html?slug=... Welke doelpagina dat is, hangt
     af van de slug in de URL en is dus pas met JavaScript te bepalen; vandaar
     geen vaste canonical hier. -->
<meta name="robots" content="noindex, follow" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<section class="section">
  <div class="wrap" style="max-width:640px; text-align:center; padding-top:60px;">
    <span class="eyebrow">Verplaatst</span>
    <h1 style="margin-bottom:14px;">Artikelen hebben nu een eigen adres</h1>
    <p style="color:var(--text-muted); font-size:16.5px; line-height:1.6; margin-bottom:26px;" id="artikel-melding">
      Je wordt automatisch doorgestuurd naar het juiste artikel.
    </p>
    <p><a class="btn btn-primary" href="artikelen.html">Bekijk alle artikelen</a></p>
    <p style="margin-top:22px; font-size:14px;"><a href="index.html" style="text-decoration:underline;">Terug naar de homepage</a></p>
  </div>
</section>

<script>
  // Oude links zagen er zo uit: artikel.html?slug=de-slug-van-het-artikel.
  // Nieuwe pagina's heten artikel-<slug>.html. We kunnen niet vooraf weten
  // welk artikel iemand zoekt (dat stond alleen in de queryparameter), dus
  // deze redirect kan alleen client-side, met replace() zodat de terugknop
  // niet in een lus terechtkomt.
  const slug = new URLSearchParams(location.search).get('slug');
  if (slug) {
    location.replace('artikel-' + encodeURIComponent(slug) + '.html');
  } else {
    document.getElementById('artikel-melding').textContent =
      'Er stond geen artikel-adres bij deze link. Bekijk hieronder alle artikelen.';
  }
</script>
</body>
</html>
