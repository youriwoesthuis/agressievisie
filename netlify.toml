# Netlify-configuratie voor AgressieVisie.
#
# De site is volledig statisch: er valt niets te bouwen, alleen te serveren.
# De 18 artikelpagina's worden gegenereerd door build/build-articles.pl en als
# echte bestanden in de repo gecommit (via de GitHub Action), dus Netlify hoeft
# daar niets voor te doen.

[build]
  publish = "."

# Geen nabewerking door Netlify: de CSS/JS zijn al met de hand geoptimaliseerd.
#
# LET OP: skip_processing hieronder blijkt "Pretty URLs" NIET uit te zetten.
# Die staat apart in het dashboard onder Project configuration > Build & deploy
# > Post processing, en die dashboard-instelling wint van dit bestand. Bij de
# eerste deploy stond Pretty URLs aan, waardoor Netlify in de geserveerde HTML
# elke interne link herschreef van href="over.html" naar href="/over". De
# pagina's bleven werken en de canonical bleef naar de .html-variant wijzen,
# maar daarmee wezen alle interne links wél naar niet-canonieke URL's.
# Pretty URLs is nu in het dashboard uitgezet. Als interne links ooit weer
# zonder .html in de broncode opduiken: dáár kijken, niet hier.
[build.processing]
  skip_processing = true

# Twee oude URL's die vroeger als HTML-stub bestonden, omdat GitHub Pages geen
# echte redirects kon. Die stubs stonden op noindex én hadden een canonical naar
# de nieuwe pagina; dat zijn tegenstrijdige signalen (canonical zegt
# "consolideer hierheen", noindex zegt "negeer deze pagina"). Op Netlify kan het
# wél goed: een echte 301. De stubbestanden zijn daarom verwijderd.
#
# Let op: de volgorde telt. Netlify pakt de eerste regel die matcht, dus de
# variant mét ?slug= moet vóór de algemene terugval staan.

# /artikel.html?slug=vroege-signalen -> /artikel-vroege-signalen.html
[[redirects]]
  from = "/artikel.html"
  query = { slug = ":slug" }
  to = "/artikel-:slug.html"
  status = 301
  force = true

# /artikel.html zonder slug had niets om naartoe te wijzen; die ging vroeger
# naar het overzicht. Dat gedrag blijft zo.
[[redirects]]
  from = "/artikel.html"
  to = "/artikelen.html"
  status = 301
  force = true

# De zelftest heet sinds enige tijd "Wat is jouw reflex?".
[[redirects]]
  from = "/zelftest.html"
  to = "/reflex.html"
  status = 301
  force = true

# MERKGROEP.md is een intern werkdocument: het beschrijft hoe agressievisie.nl,
# bureauweerbaarenveilig.nl en actinmove.nl hun zoekwoorden verdelen. Het staat
# in de repo zodat iedereen die hier werkt de afspraken ziet, maar omdat de
# publish-map "." is, zou Netlify het anders gewoon uitserveren op
# agressievisie.nl/MERKGROEP.md. Deze regel geeft er een 404 op.
[[redirects]]
  from = "/MERKGROEP.md"
  to = "/404.html"
  status = 404
  force = true

# Securityheaders. Deze stonden eerder als Transform Rule in het
# Cloudflare-dashboard. Nu staan ze in de repo, zodat ze samen met de site
# versiebeheerd zijn en niet meer in een dashboard "verstopt" zitten.
# De waarden zijn 1-op-1 gelijk aan wat er voorheen live stond.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

# De bouwmap bevat het paginatemplate met {{PLACEHOLDERS}} erin en het
# Perl-script. Die zijn publiek bereikbaar (dat waren ze op GitHub Pages ook),
# maar ze horen niet in de zoekresultaten thuis.
[[headers]]
  for = "/build/*"
  [headers.values]
    X-Robots-Tag = "noindex"
